
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>ShopZone | Shop Sports Items, Dresses, Shoes & Watches Online</title>

    <meta
      name="description"
      content="Welcome to ShopZone! Shop sports items, sports accessories, stylish dresses, shoes, sneakers, watches, and fashion accessories online. Discover products for your everyday lifestyle."
    />

    <meta
      name="keywords"
      content="ShopZone, online shopping, sports items, sports equipment, sports accessories, dresses online, men's clothing, women's clothing, shoes online, sneakers, running shoes, watches online, fashion accessories, lifestyle products"
    />

    <meta name="author" content="ShopZone" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://ecommerce-client-sports.vercel.app/"
    />

    <!-- Favicon: ShopZone Logo -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/ShopZoneSpeedBagLogo.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/assets/ShopZoneSpeedBagLogo.png"
    />

    <!-- Open Graph: Facebook, WhatsApp, Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShopZone" />

    <meta
      property="og:title"
      content="ShopZone | Sports, Fashion, Shoes & Watches"
    />

    <meta
      property="og:description"
      content="Explore sports products, trendy dresses, shoes, watches, and fashion accessories at ShopZone. Find products for your everyday needs."
    />

    <meta
      property="og:url"
      content="https://ecommerce-client-sports.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://ecommerce-client-sports.vercel.app/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="ShopZone online store featuring sports products, dresses, shoes, and watches"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="ShopZone | Shop Online"
    />

    <meta
      name="twitter:description"
      content="Shop sports items, dresses, shoes, watches, and fashion accessories online at ShopZone."
    />

    <meta
      name="twitter:image"
      content="https://ecommerce-client-sports.vercel.app/og-image.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
